<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Calendar <small>(mock)</small></h1>
            <nav>
                <a href="/">Upload</a>
                <a href="/review">Review</a>
            </nav>
        </header>

        {% if events %}
            {% for event in events %}
                <div class="card">
                    <h2>{{ event.title }}</h2>
                    <p class="meta">Due: {{ event.date }}</p>
                    {% if event.description %}
                        <p class="meta">{{ event.description }}</p>
                    {% endif %}
                </div>
            {% endfor %}
        {% else %}
            <p class="empty">No events yet.</p>
        {% endif %}
    </div>
</body>
</html>
