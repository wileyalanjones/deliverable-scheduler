<!DOCTYPE html>
<html>
<head><title>Calendar</title></head>
<body>
    <h1>Your Calendar (mock)</h1>

    {% if events %}
        {% for event in events %}
            <div style="border:1px solid #ccc; margin:10px; padding:10px;">
                <strong>{{ event.title }}</strong>
                <p>Due: {{ event.date }}</p>
                {% if event.description %}
                    <p>{{ event.description }}</p>
                {% endif %}
            </div>
        {% endfor %}
    {% else %}
        <p>No events yet.</p>
    {% endif %}

    <p><a href="/">Upload another document</a> · <a href="/review">Review</a></p>
</body>
</html>
